# Yerel geliştirme için (Bölüm 14) — api, web ve db servisleri; nginx dahil
# değil (reverse proxy + SSL sonlandırma sadece canlı deploy'da gerekli,
# bkz. Bölüm 15). Portlar doğrudan host'a expose edilir.
#
# Kullanım:
#   cp .env.example .env   # JWT secret'larını doldur (openssl rand -base64 32)
#   docker compose up --build

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-roomsync}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - roomsync-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-roomsync}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # `db` — Compose'un dahili DNS'i üzerinden servis adı; api ve db aynı
      # ağda olduğundan bu, tarayıcıdan değil sadece container'lar arasından
      # erişilir (NEXT_PUBLIC_API_URL'in aksine, bkz. web servisi).
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-roomsync}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Panelin tarayıcıda çalıştığı gerçek origin (Bölüm 15, madde 7 — domain
      # kararına göre değişir; yerelde varsayılan http://localhost:3000).
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - '${API_PORT:-4000}:4000'

  web:
    build:
      context: ./web
      args:
        # Build-time'da client bundle'a gömülür (bkz. web/Dockerfile) — bu
        # yüzden runtime `environment:` değil, `build.args` üzerinden geçilir.
        # Tarayıcıdan erişilebilir olmalı; container ağındaki "api" servis
        # adı DEĞİL (o sadece container'lar arasından çözümlenir).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-3000}:3000'

volumes:
  roomsync-db-data:
